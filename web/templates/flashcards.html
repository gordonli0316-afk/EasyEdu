<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyEdu — Knowledge cards</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f6f8fb; margin: 0; }
        .page { max-width: 760px; margin: 0 auto; padding: 32px 20px 56px; }
        h1 { font-size: 1.5rem; margin: 8px 0 6px; }
        .subtitle { color: #64748b; font-size: 0.92rem; margin: 0 0 20px; line-height: 1.6; }
        .toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
        select { padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; font-size: 0.9rem; }
        .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 28px; min-height: 240px;
                box-shadow: 0 1px 3px rgba(15,23,42,0.06); cursor: pointer; display: flex; flex-direction: column; }
        .card-meta { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; color: #2563eb; font-weight: 700; margin-bottom: 10px; }
        .card-title { font-size: 1.2rem; font-weight: 700; margin: 0 0 14px; color: #0f172a; }
        .card-body { font-size: 0.95rem; line-height: 1.75; color: #334155; white-space: pre-wrap; }
        .card-hint { margin-top: auto; padding-top: 18px; font-size: 0.8rem; color: #94a3b8; }
        .controls { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 20px; }
        .btn { padding: 9px 20px; border-radius: 6px; border: 1px solid #d1d5db; background: #fff; font-size: 0.9rem;
               font-weight: 600; color: #374151; cursor: pointer; }
        .btn:hover { background: #f8fafc; }
        .btn-primary { background: #2563eb; border-color: #2563eb; color: #fff; }
        .btn-primary:hover { background: #1d4ed8; }
        .counter { font-size: 0.9rem; color: #475569; font-weight: 600; min-width: 70px; text-align: center; }
        .empty { text-align: center; color: #64748b; padding: 40px 0; }
        @media (max-width: 768px) {
            .page { padding: 20px 14px 40px; }
            .card { padding: 20px; min-height: 200px; }
            .card-title { font-size: 1.05rem; }
        }
    </style>
</head>
<body>
    <nav class="fixed-nav">
        <div class="nav-logo">EasyEdu</div>
        <div class="nav-links">
            <a href="/" class="nav-item" data-i18n="nav_home">Home</a>
            <a href="/problems" class="nav-item" data-i18n="nav_practice">Practice</a>
            <a href="/knowledge" class="nav-item" data-i18n="nav_knowledge">Knowledge</a>
            <a href="/flashcards" class="nav-item active" data-i18n="nav_flash">Flashcards</a>
            <button id="lang-toggle-btn" onclick="toggleLang()" style="margin-left:12px;padding:4px 12px;border:1px solid #d1d5db;border-radius:6px;background:#fff;cursor:pointer;font-size:0.85rem;font-weight:600;color:#374151;">中文</button>
        </div>
    </nav>

    <div class="page">
        <h1 data-i18n="cards_title">Knowledge cards</h1>
        <p class="subtitle" data-i18n="cards_subtitle">Every card is a knowledge point from the question bank. Read the title, say the explanation out loud, then flip to check yourself.</p>

        <div class="toolbar">
            <select id="subject-filter"><option value="" data-i18n="cards_all">All courses</option></select>
            <button class="btn" onclick="shuffleCards()" data-i18n="cards_shuffle">Shuffle</button>
        </div>

        <div id="card" class="card" onclick="toggleFlip()">
            <div class="card-meta" id="card-meta"></div>
            <h2 class="card-title" id="card-title" data-i18n="loading">Loading…</h2>
            <div class="card-body" id="card-body"></div>
            <div class="card-hint" id="card-hint" data-i18n="cards_flip">Click the card to reveal the explanation</div>
        </div>

        <div class="controls">
            <button class="btn" onclick="prevCard()" data-i18n="cards_prev">Previous</button>
            <span class="counter" id="card-counter">0 / 0</span>
            <button class="btn" onclick="nextCard()" data-i18n="cards_next">Next</button>
        </div>
    </div>

    <script src="/static/js/i18n.js"></script>
    <script>
        let cards = [];
        let filtered = [];
        let index = 0;
        let flipped = false;

        const titleEl = document.getElementById('card-title');
        const bodyEl = document.getElementById('card-body');
        const metaEl = document.getElementById('card-meta');
        const hintEl = document.getElementById('card-hint');
        const counterEl = document.getElementById('card-counter');
        const subjectSelect = document.getElementById('subject-filter');

        async function loadCards() {
            try {
                const res = await fetch('/api/knowledge/cards?limit=200');
                if (!res.ok) throw new Error('cards request failed');
                const data = await res.json();
                cards = data.cards || [];

                const subjects = [...new Set(cards.map(c => c.subject).filter(Boolean))].sort();
                subjects.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s;
                    opt.textContent = s.split('_').map(w => (['ap', 'ib', 'hl', 'sl', 'cs', 'aa', 'ai'].includes(w)
                        ? w.toUpperCase() : w.charAt(0).toUpperCase() + w.slice(1))).join(' ');
                    subjectSelect.appendChild(opt);
                });
                subjectSelect.addEventListener('change', () => {
                    filtered = subjectSelect.value ? cards.filter(c => c.subject === subjectSelect.value) : cards.slice();
                    index = 0;
                    render();
                });

                filtered = cards.slice();
                render();
            } catch (err) {
                console.error('loadCards failed', err);
                titleEl.textContent = t('load_fail');
                bodyEl.textContent = '';
            }
        }

        function render() {
            if (!filtered.length) {
                titleEl.textContent = t('cards_empty');
                bodyEl.textContent = '';
                metaEl.textContent = '';
                hintEl.textContent = '';
                counterEl.textContent = '0 / 0';
                return;
            }
            const card = filtered[index];
            metaEl.textContent = card.subject ? card.subject.replace(/_/g, ' ').toUpperCase() : '';
            titleEl.textContent = card.title || card.id;
            bodyEl.textContent = flipped ? (card.summary || '') : '';
            hintEl.textContent = flipped ? t('cards_flip_back') : t('cards_flip');
            counterEl.textContent = `${index + 1} / ${filtered.length}`;
        }

        function toggleFlip() { flipped = !flipped; render(); }
        function nextCard() { if (!filtered.length) return; index = (index + 1) % filtered.length; flipped = false; render(); }
        function prevCard() { if (!filtered.length) return; index = (index - 1 + filtered.length) % filtered.length; flipped = false; render(); }
        function shuffleCards() {
            for (let i = filtered.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [filtered[i], filtered[j]] = [filtered[j], filtered[i]];
            }
            index = 0; flipped = false; render();
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowRight') nextCard();
            if (e.key === 'ArrowLeft') prevCard();
            if (e.key === ' ') { e.preventDefault(); toggleFlip(); }
        });

        document.addEventListener('DOMContentLoaded', () => { initI18n(); loadCards(); });
        document.addEventListener('easylangchange', render);
    </script>
</body>
</html>
