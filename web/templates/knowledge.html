<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyEdu — Knowledge</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/knowledge.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- 添加Font Awesome图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <!-- 固定导航栏 -->
    <nav class="fixed-nav">
        <div class="nav-logo">EasyEdu · IB/AP</div>
        <div class="nav-links">
            <a href="/" class="nav-item" data-i18n="nav_home">Home</a>
            <a href="/problems" class="nav-item" data-i18n="nav_practice">Practice</a>
            <a href="/knowledge" class="nav-item active" data-i18n="nav_knowledge">Knowledge</a>
            <a href="/flashcards" class="nav-item" data-i18n="nav_flash">Flashcards</a>
            <button id="lang-toggle-btn" onclick="toggleLang()" style="margin-left:12px;padding:4px 12px;border:1px solid #d1d5db;border-radius:6px;background:#fff;cursor:pointer;font-size:0.85rem;font-weight:600;color:#374151;">中文</button>
        </div>
    </nav>
    <div class="main-container">
        <div class="content-wrapper">
            <!-- 左侧面板: 包含章节列表和知识点列表 -->
            <div class="sidebar-panel">
                <div class="chapter-section">
                    <h2 data-i18n="kp_chapters">Chapters</h2>
                    <ul id="chapter-list" class="list-panel"></ul>
                </div>
                
                <div class="knowledge-list-section">
                    <h2><span data-i18n="kp_list">Knowledge points</span> <span id="current-chapter-title"></span></h2>
                    <div id="knowledge-list" class="list-panel">
                        <p class="empty-tip" data-i18n="kp_pick_chapter">Choose a chapter to see its knowledge points</p>
                    </div>
                </div>
            </div>
            
            <!-- 右侧面板: 显示知识点详情 -->
            <div class="detail-panel">
                <div id="knowledge-detail" class="knowledge-detail-card" style="display: none;">
                    <div class="knowledge-detail-header">
                        <div class="knowledge-detail-title">
                            <h2 data-i18n="kp_detail">Knowledge point detail</h2>
                            <h3 id="knowledge-title"></h3>
                        </div>
                    </div>
                    <div class="knowledge-detail-container">
                        <div id="knowledge-summary" class="knowledge-summary"></div>
                    </div>
                </div>
                
                <div id="empty-detail-placeholder" class="empty-detail-placeholder">
                    <div class="placeholder-content">
                        <i class="fas fa-book-open placeholder-icon"></i>
                        <p data-i18n="kp_pick">Choose a knowledge point on the left to read its explanation</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/static/js/knowledge.js"></script>
    <script src="/static/js/i18n.js"></script>
    <script>document.addEventListener('DOMContentLoaded', initI18n);</script>
</body>
</html>
