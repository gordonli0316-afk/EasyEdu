<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyEdu - 题目精练</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/js/i18n.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <!-- 固定导航栏 -->
    <nav class="fixed-nav">
        <div class="nav-logo">EasyEdu</div>
        <div class="nav-links">
            <a href="/" class="nav-item" data-i18n="nav_home">Home</a>
            <a href="/problems" class="nav-item active" data-i18n="nav_practice">Practice</a>
            <a href="/knowledge" class="nav-item" data-i18n="nav_knowledge">Knowledge</a>
            <span class="nav-item nav-disabled" title="Coming soon" style="opacity:0.4;cursor:not-allowed;">Upload</span>
            <span class="nav-item nav-disabled" title="Coming soon" style="opacity:0.4;cursor:not-allowed;">Flashcards</span>
            <button id="lang-toggle-btn" onclick="toggleLang()" style="margin-left:12px;padding:4px 12px;border:1px solid #d1d5db;border-radius:6px;background:#fff;cursor:pointer;font-size:0.85rem;font-weight:600;color:#374151;">中文</button>
        </div>
    </nav>
    <div class="main-container">
        <div class="content-wrapper">
            <div class="chapter-panel">
                <h2 data-i18n="select_subject">Select a subject</h2>
                <select id="subject-select" class="subject-select">
                    <option value="">All subjects</option>
                </select>
                <h2 class="panel-subtitle" data-i18n="chapter_list">Chapters</h2>
                <ul id="chapter-list" class="list-panel"></ul>
            </div>
            
            <div class="questions-panel">
                <!-- 不要把 span 嵌进 data-i18n 元素里，applyI18n 用 textContent 会把 span 删掉 -->
                <h2><span data-i18n="question_list">Questions</span> — <span id="current-chapter-title"></span></h2>
                <div id="question-list" class="list-panel">
                    <p class="empty-tip" data-i18n="select_tip">Select a subject and chapter to view questions</p>
                </div>
            </div>
        </div>
    </div>
    
    <style>
        .subject-select {
            width: 100%;
            padding: 10px;
            font-size: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            margin-top: 10px;
            background: #fff;
        }
        .panel-subtitle {
            margin-top: 20px;
        }
    </style>
    
    <script src="/static/js/problems.js"></script>
    <script>document.addEventListener('DOMContentLoaded', initI18n);</script>
</body>
</html>
