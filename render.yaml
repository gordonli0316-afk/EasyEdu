# Render Blueprint — deploy EasyEdu as a public HTTPS website.
#
# In the Render dashboard: New + -> Blueprint -> connect this repository.
# Render reads this file, builds the app, and gives you a URL such as
# https://easyedu.onrender.com that anyone can open without any setup.
#
# Free plan notes: the instance sleeps after ~15 minutes of inactivity, so the
# first visit after a pause takes 30-60 seconds to wake up. Everything else
# (HTTPS, custom domain, health checks) works on the free plan.
services:
  - type: web
    name: easyedu
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # DeepSeek is used automatically as soon as this key exists, with no other
      # setting required (EasyEdu resolves the backend from the environment).
      # `sync: false` means the value is entered in the Render dashboard and is
      # never read from, or written to, this repository.
      #
      # Leave it empty and the site still works: EasyEdu detects that no model is
      # reachable and serves answers from the bundled reference material instead.
      - key: DEEPSEEK_API_KEY
        sync: false
      # Optional: pin a specific model. Defaults to deepseek-chat.
      # - key: DEEPSEEK_MODEL
      #   value: deepseek-chat
